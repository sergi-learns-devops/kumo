name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check binary size
        run: |
          ls -lh target/release/kumo
          SIZE=$(stat -f%z target/release/kumo 2>/dev/null || stat -c%s target/release/kumo)
          echo "Binary size: ${SIZE} bytes"
          if [ "$SIZE" -gt 5242880 ]; then
            echo "⚠ Warning: binary exceeds 5MB"
          fi
