[package]
name = "kumo"
version = "0.5.1"
edition = "2021"
description = "Cloud instance type recommender (GCP, AWS & Azure)"
license = "MIT"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
clap_complete = "4.5"
dialoguer = { version = "0.11", default-features = false }
ureq = { version = "2.10", default-features = false, features = ["tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
miniz_oxide = "0.8"
ring = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
